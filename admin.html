<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGPracticas - Panel de Administración</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            max-width: 900px;
            width: 100%;
            background: var(--card-bg, #1a1f2c);
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            box-sizing: border-box;
            margin: 20px auto;
        }
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.85rem;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color, #2d3748);
            color: var(--text-primary, #fff);
        }
        th {
            font-weight: 700;
            color: var(--text-secondary, #a0aec0);
        }
        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .badge-impuntual { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .badge-apelado { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .badge-puntual { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        
        .btn-accion {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .btn-accion:hover { background: #2563eb; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 15px;
            box-sizing: border-box;
        }
        .modal-card {
            background: var(--card-bg, #1a1f2c);
            border: 1px solid var(--border-color, #2d3748);
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-sizing: border-box;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="admin-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div>
                <h1 style="font-size: 1.5rem; margin: 0; color: var(--text-primary);">Panel de Administración</h1>
                <p style="font-size: 0.85rem; color: var(--text-secondary); margin: 4px 0 0 0;">Gestión de Asistencia y Comprobantes</p>
            </div>
            <button id="btnCerrarSesionAdmin" class="btn-danger-link" style="width: auto; padding: 8px 16px; margin: 0;">Cerrar Sesión</button>
        </div>

        <div style="margin-bottom: 15px;">
            <input type="text" id="txtFiltroUsuario" placeholder="Filtrar por usuario o nombre..." style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-primary); font-size: 0.85rem; box-sizing: border-box;">
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Fecha / Hora</th>
                        <th>Usuario</th>
                        <th>Tipo</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaRegistrosBody">
                    <tr><td colspan="5" style="text-align: center; color: var(--text-secondary);">Cargando registros...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- MODAL DE DETALLES Y ARCHIVO -->
    <div id="modalDetalle" class="modal-overlay hidden">
        <div class="modal-card">
            <h3 style="margin-top: 0; color: var(--text-primary);">Detalle de Justificación</h3>
            <div id="modalContenido" style="font-size: 0.85rem; color: var(--text-primary); line-height: 1.5; margin-bottom: 20px;">
                <!-- Se llena dinámicamente -->
            </div>
            <div style="text-align: right;">
                <button type="button" class="btn-accion" id="cerrarModal" style="background: #64748b;">Cerrar</button>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } 
        from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB6KT4Gw-O4NDhsAREAeAdAmrIuMH53ZyQ",
        authDomain: "rgpracticantes-da4bc.firebaseapp.com",
        projectId: "rgpracticantes-da4bc",
        storageBucket: "rgpracticantes-da4bc.firebasestorage.app",
        messagingSenderId: "378103051147",
        appId: "1:378103051147:web:0c30387cc661d75e0ff58e"
    };

    const db = getFirestore(initializeApp(firebaseConfig));
    let listaRegistrosGlobal = [];

    async function cargarRegistrosAdmin() {
        const tbody = document.getElementById("tablaRegistrosBody");
        try {
            const q = query(collection(db, "registros"), orderBy("creado", "desc"));
            const snapshot = await getDocs(q);
            
            listaRegistrosGlobal = [];
            snapshot.forEach(doc => {
                listaRegistrosGlobal.push({ id: doc.id, ...doc.data() });
            });

            renderizarTabla(listaRegistrosGlobal);
        } catch (e) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #ef4444;">Error al cargar: ${e.message}</td></tr>`;
        }
    }

    function renderizarTabla(registros) {
        const tbody = document.getElementById("tablaRegistrosBody");
        if (registros.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-secondary);">No hay registros encontrados.</td></tr>`;
            return;
        }

        tbody.innerHTML = "";
        registros.forEach(reg => {
            const tr = document.createElement("tr");
            
            let claseBadge = "badge-puntual";
            if (reg.estadoPuntualidad === "Impuntual" || reg.estadoPuntualidad === "Descuidado") claseBadge = "badge-impuntual";
            if (reg.estadoPuntualidad === "Apelado / Justificado") claseBadge = "badge-apelado";

            tr.innerHTML = `
                <td>${reg.fechaHora || 'N/D'}</td>
                <td><strong>${reg.nombre || reg.usuario}</strong></td>
                <td>${reg.tipo}</td>
                <td><span class="badge ${claseBadge}">${reg.estadoPuntualidad || 'Puntual'}</span></td>
                <td><button class="btn-accion" onclick="verDetalle('${reg.id}')">Ver Detalles</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    window.verDetalle = function(id) {
        const reg = listaRegistrosGlobal.find(r => r.id === id);
        if (!reg) return;

        const modalContenido = document.getElementById("modalContenido");
        
        let htmlArchivo = `<p style="color: var(--text-secondary); margin-top: 15px;"><em>Este registro no contiene archivo adjunto.</em></p>`;
        
        if (reg.archivoUrl) {
            htmlArchivo = `
                <div style="margin-top: 15px; padding: 12px; background: var(--input-bg, #111827); border-radius: 10px; border: 1px solid var(--border-color);">
                    <p style="margin: 0 0 8px 0; font-weight: 700; color: var(--text-primary);">📎 Comprobante del Usuario:</p>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <a href="${reg.archivoUrl}" target="_blank" class="btn-accion" style="text-decoration: none; display: inline-flex; align-items: center; gap: 5px;">
                            👁️ Ver Archivo
                        </a>
                        <a href="${reg.archivoUrl}" download target="_blank" class="btn-accion" style="text-decoration: none; display: inline-flex; align-items: center; gap: 5px; background: #10b981;">
                            ⬇️ Descargar
                        </a>
                    </div>
                </div>
            `;
        }

        modalContenido.innerHTML = `
            <p><strong>Usuario:</strong> ${reg.nombre || reg.usuario}</p>
            <p><strong>Tipo de Registro:</strong> ${reg.tipo}</p>
            <p><strong>Fecha y Hora:</strong> ${reg.fechaHora}</p>
            <p><strong>Distancia GPS:</strong> ${reg.distanciaMetros ? reg.distanciaMetros + ' metros' : 'N/D'}</p>
            <p><strong>Observaciones:</strong> ${reg.observaciones || 'Ninguna'}</p>
            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 12px 0;">
            <p><strong>Motivo / Justificación:</strong><br><span style="color: var(--text-secondary);">${reg.justificacion || 'No se ingresó justificación.'}</span></p>
            ${htmlArchivo}
        `;

        document.getElementById("modalDetalle").classList.remove("hidden");
    };

    document.getElementById("cerrarModal").addEventListener("click", () => {
        document.getElementById("modalDetalle").classList.add("hidden");
    });

    document.getElementById("txtFiltroUsuario").addEventListener("input", (e) => {
        const texto = e.target.value.toLowerCase();
        const filtrados = listaRegistrosGlobal.filter(r => 
            (r.nombre && r.nombre.toLowerCase().includes(texto)) || 
            (r.usuario && r.usuario.toLowerCase().includes(texto))
        );
        renderizarTabla(filtrados);
    });

    document.getElementById("btnCerrarSesionAdmin").addEventListener("click", () => {
        window.location.href = "index.html";
    });

    cargarRegistrosAdmin();
</script>
</body>
</html>
