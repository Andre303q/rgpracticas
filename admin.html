<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGPracticas - Panel Administrativo</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- Librerías para exportar a Excel y PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        .admin-wrapper {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .admin-table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.85rem;
            color: var(--text-primary);
        }
        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            background-color: var(--table-header-bg);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        tr:last-child td {
            border-bottom: none;
        }
        .toolbar-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
            flex-wrap: wrap;
            gap: 15px;
        }
        .filter-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--input-bg);
            padding: 8px 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .filter-box input {
            background: transparent;
            border: none;
            color: var(--text-primary);
            outline: none;
            font-size: 0.85rem;
            font-family: inherit;
        }
        .export-group {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="admin-wrapper">
        <div class="card" style="max-width: 100%;">
            
            <!-- BOTÓN CAMBIO DE TEMA -->
            <div class="theme-switch-container">
                <button class="theme-toggle-btn" id="btnThemeToggle" type="button">
                    <span id="themeIcon">🌙</span> <span id="themeText">Oscuro</span>
                </button>
            </div>

            <!-- CABECERA DEL PANEL -->
            <div class="admin-header">
                <div class="brand-box" style="text-align: left; margin: 0;">
                    <div class="logo-diamond" style="margin: 0 0 10px 0; width: 45px; height: 45px;"><span>RG</span></div>
                    <h1 style="font-size: 1.3rem;">Panel Administrativo</h1>
                    <p>Gestión de asistencia y usuarios</p>
                </div>
                <button class="btn-danger-link" id="btnCerrarSesionAdmin" style="width: auto; padding: 10px 20px; margin: 0;">Cerrar Sesión</button>
            </div>

            <!-- PESTAÑAS DE NAVEGACIÓN -->
            <div class="nav-tabs" id="tabsAdmin" style="margin-bottom: 20px;">
                <button class="tab-link active" id="tabMarcaciones" type="button" onclick="cambiarVistaAdmin('marcaciones')">Marcaciones</button>
                <button class="tab-link" id="tabUsuarios" type="button" onclick="cambiarVistaAdmin('usuarios')">Usuarios Registrados</button>
            </div>

            <!-- VISTA 1: MARCACIONES Y FILTROS -->
            <div id="seccionMarcaciones">
                <div class="toolbar-container">
                    <!-- FILTRO DE FECHA -->
                    <div class="filter-box">
                        <span style="font-size: 0.72rem; font-weight: 700; color: var(--text-secondary);">FILTRAR FECHA:</span>
                        <input type="date" id="inputFiltroFecha" onchange="filtrarRegistrosPorFecha()">
                        <button type="button" onclick="limpiarFiltroFecha()" style="background: var(--primary-blue); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; cursor: pointer;">Todos</button>
                    </div>

                    <!-- BOTONES DE EXPORTACIÓN -->
                    <div class="export-group">
                        <button type="button" class="btn-primary" onclick="exportarExcel()" style="background-color: #10b981; width: auto; padding: 10px 16px; font-size: 0.82rem; box-shadow: none;">📊 Excel</button>
                        <button type="button" class="btn-primary" onclick="exportarPDF()" style="background-color: #ef4444; width: auto; padding: 10px 16px; font-size: 0.82rem; box-shadow: none;">📄 PDF</button>
                    </div>
                </div>

                <h3 style="font-size: 1rem; color: var(--text-primary); margin-bottom: 10px;">🕒 Registro de Asistencias</h3>

                <div class="admin-table-container">
                    <table id="tablaAsistencias">
                        <thead>
                            <tr>
                                <th>Practicante</th>
                                <th>Tipo Marcación</th>
                                <th>Fecha y Hora</th>
                                <th>Distancia</th>
                                <th>Puntualidad</th>
                                <th>Observaciones</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoTablaRegistros">
                            <tr><td colspan="7" style="text-align: center; color: var(--text-secondary);">Cargando registros...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- VISTA 2: USUARIOS REGISTRADOS -->
            <div id="seccionUsuarios" class="hidden">
                <h3 style="font-size: 1rem; color: var(--text-primary); margin-bottom: 10px;">👥 Lista de Usuarios Registrados</h3>

                <div class="admin-table-container">
                    <table id="tablaUsuarios">
                        <thead>
                            <tr>
                                <th>Nombre Completo</th>
                                <th>Usuario</th>
                                <th>Rol</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoTablaUsuarios">
                            <tr><td colspan="3" style="text-align: center; color: var(--text-secondary);">Cargando usuarios...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

<!-- SCRIPT DE TEMA Y PESTAÑAS -->
<script>
    const btnToggle = document.getElementById("btnThemeToggle");
    const themeIcon = document.getElementById("themeIcon");
    const themeText = document.getElementById("themeText");

    function aplicarTema(tema) {
        if (tema === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
            themeIcon.textContent = "☀️";
            themeText.textContent = "Claro";
        } else {
            document.documentElement.setAttribute("data-theme", "light");
            themeIcon.textContent = "🌙";
            themeText.textContent = "Oscuro";
        }
    }

    const temaGuardado = localStorage.getItem("tema_app");
    const prefiereOscuro = window.matchMedia("(prefers-color-scheme: dark)").matches;
    aplicarTema(temaGuardado || (prefiereOscuro ? "dark" : "light"));

    btnToggle.addEventListener("click", () => {
        const temaActual = document.documentElement.getAttribute("data-theme");
        const nuevoTema = temaActual === "dark" ? "light" : "dark";
        aplicarTema(nuevoTema);
        localStorage.setItem("tema_app", nuevoTema);
    });

    document.getElementById("btnCerrarSesionAdmin").addEventListener("click", () => {
        window.location.href = "index.html";
    });

    function cambiarVistaAdmin(vista) {
        const secMarcaciones = document.getElementById("seccionMarcaciones");
        const secUsuarios = document.getElementById("seccionUsuarios");
        const tabMarc = document.getElementById("tabMarcaciones");
        const tabUsu = document.getElementById("tabUsuarios");

        if (vista === 'marcaciones') {
            secMarcaciones.classList.remove("hidden");
            secUsuarios.classList.add("hidden");
            tabMarc.classList.add("active");
            tabUsu.classList.remove("active");
        } else {
            secUsuarios.classList.remove("hidden");
            secMarcaciones.classList.add("hidden");
            tabUsu.classList.add("active");
            tabMarc.classList.remove("active");
        }
    }
</script>

<!-- SCRIPT FIREBASE Y DATOS -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB6KT4Gw-O4NDhsAREAeAdAmrIuMH53ZyQ",
        authDomain: "rgpracticantes-da4bc.firebaseapp.com",
        projectId: "rgpracticantes-da4bc",
        storageBucket: "rgpracticantes-da4bc.firebasestorage.app",
        messagingSenderId: "378103051147",
        appId: "1:378103051147:web:0c30387cc661d75e0ff58e"
    };

    const db = getFirestore(initializeApp(firebaseConfig));
    let listaRegistrosGlobal = [];

    async function cargarDatosAdmin() {
        const cuerpoTablaReg = document.getElementById("cuerpoTablaRegistros");
        const cuerpoTablaUsu = document.getElementById("cuerpoTablaUsuarios");

        try {
            // Cargar Registros
            const qReg = query(collection(db, "registros"), orderBy("creado", "desc"));
            const snapReg = await getDocs(qReg);
            listaRegistrosGlobal = [];

            if (snapReg.empty) {
                cuerpoTablaReg.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--text-secondary);">No hay registros disponibles.</td></tr>`;
            } else {
                snapReg.forEach((documento) => {
                    // Guardamos tanto los datos como el id único del documento de Firebase
                    const dataReg = documento.data();
                    dataReg.idFirebase = documento.id; 
                    listaRegistrosGlobal.push(dataReg);
                });
                renderizarTablaRegistros(listaRegistrosGlobal);
            }

            // Cargar Usuarios
            const snapUsu = await getDocs(collection(db, "usuarios"));
            if (snapUsu.empty) {
                cuerpoTablaUsu.innerHTML = `<tr><td colspan="3" style="text-align: center; color: var(--text-secondary);">No hay usuarios registrados.</td></tr>`;
            } else {
                let htmlUsu = "";
                snapUsu.forEach((doc) => {
                    const u = doc.data();
                    htmlUsu += `
                        <tr>
                            <td><strong>${u.nombre || 'Sin Nombre'}</strong></td>
                            <td>${u.usuario}</td>
                            <td><span style="padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; background: var(--pill-bg-info); color: var(--primary-blue);">${u.rol || 'practicante'}</span></td>
                        </tr>
                    `;
                });
                cuerpoTablaUsu.innerHTML = htmlUsu;
            }

        } catch (error) {
            cuerpoTablaReg.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #ef4444;">Error al cargar: ${error.message}</td></tr>`;
        }
    }

    window.renderizarTablaRegistros = function(datos) {
        const cuerpoTablaReg = document.getElementById("cuerpoTablaRegistros");
        if (datos.length === 0) {
            cuerpoTablaReg.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--text-secondary);">No hay registros para esta fecha.</td></tr>`;
            return;
        }

        let html = "";
        datos.forEach((r) => {
            const estado = (r.estadoPuntualidad || "").toLowerCase();
            
            let claseBadge = "badge-gris";
            if (estado.includes("puntual") || estado.includes("temprano")) {
                claseBadge = "badge-verde";
            } else if (estado.includes("tarde") || estado.includes("impuntual") || estado.includes("retraso")) {
                claseBadge = "badge-rojo";
            } else if (estado.includes("permiso") || estado.includes("justificado")) {
                claseBadge = "badge-amarillo";
            }

            html += `
                <tr>
                    <td><strong>${r.nombre || r.usuario}</strong></td>
                    <td>${r.tipo}</td>
                    <td>${r.fechaHora}</td>
                    <td>${r.distanciaMetros} m</td>
                    <td><span class="badge-estado ${claseBadge}">${r.estadoPuntualidad || 'Registrado'}</span></td>
                    <td>${r.observaciones || '-'}</td>
                    <td>
                        <button type="button" onclick="eliminarRegistro('${r.idFirebase}')" style="background-color: #ef4444; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: 700;">
                            🗑️ Borrar
                        </button>
                    </td>
                </tr>
            `;
        });
        cuerpoTablaReg.innerHTML = html;
    }

    // Función global para eliminar registros desde la web
    window.eliminarRegistro = async function(idFirebase) {
        if (!idFirebase) {
            alert("Error: No se encontró el ID de este registro.");
            return;
        }

        const confirmar = confirm("¿Estás seguro de que deseas eliminar este registro de asistencia?");
        if (!confirmar) return;

        try {
            await deleteDoc(doc(db, "registros", idFirebase));
            alert("Registro eliminado correctamente.");
            cargarDatosAdmin(); // Recarga la tabla de inmediato
        } catch (error) {
            console.error("Error al eliminar:", error);
            alert("No se pudo eliminar el registro: " + error.message);
        }
    }

    window.filtrarRegistrosPorFecha = function() {
        const inputVal = document.getElementById("inputFiltroFecha").value;
        if (!inputVal) return;

        const partes = inputVal.split("-");
        const fechaFiltradaFormat = `${parseInt(partes[2])}/${parseInt(partes[1])}/${partes[0]}`;

        const filtrados = listaRegistrosGlobal.filter(r => r.fechaHoy === fechaFiltradaFormat);
        renderizarTablaRegistros(filtrados);
    }

    window.limpiarFiltroFecha = function() {
        document.getElementById("inputFiltroFecha").value = "";
        renderizarTablaRegistros(listaRegistrosGlobal);
    }

    // Ejecutar al iniciar
    cargarDatosAdmin();
</script>

<!-- SCRIPT DE EXPORTACIÓN EXCEL Y PDF -->
<script>
    function exportarExcel() {
        const tabla = document.getElementById("tablaAsistencias");
        if (!tabla) {
            alert("No se encontró la tabla de asistencias.");
            return;
        }
        const archivo = XLSX.utils.table_to_book(tabla, { sheet: "Asistencias" });
        XLSX.writeFile(archivo, "Reporte_Asistencias_RGPracticas.xlsx");
    }

    function exportarPDF() {
        const elemento = document.querySelector(".card");
        const opciones = {
            margin:       10,
            filename:     'Reporte_Asistencias_RGPracticas.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
        };
        html2pdf().from(elemento).set(opciones).save();
    }
</script>

</body>
</html>
