<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador - RGPracticas</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { align-items: flex-start; padding: 20px; }
        .admin-wrapper { width: 100%; max-width: 1100px; margin: 0 auto; }
        
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border-card);
            padding: 16px 24px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-card);
        }

        .table-card {
            background: var(--card-bg);
            border: 1px solid var(--border-card);
            border-radius: 24px;
            padding: 20px;
            box-shadow: var(--shadow-card);
            overflow-x: auto;
        }

        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.875rem; }
        th { padding: 12px 14px; border-bottom: 1px solid var(--border-card); color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; }
        td { padding: 14px; border-bottom: 1px solid var(--border-card); }

        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; display: inline-block; }
        .badge-Puntual { background: rgba(16, 185, 129, 0.15); color: var(--status-success); }
        .badge-Impuntual { background: rgba(239, 68, 68, 0.15); color: var(--status-error); }
        .badge-Descuidado { background: rgba(217, 119, 6, 0.15); color: var(--status-warning); }
        .badge-Justificado { background: rgba(16, 185, 129, 0.25); color: var(--status-success); border: 1px solid var(--status-success); }
        .badge-Rechazado { background: rgba(239, 68, 68, 0.25); color: var(--status-error); border: 1px solid var(--status-error); }

        .btn-sm { padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; border: none; cursor: pointer; }
        .btn-ok { background: var(--status-success); color: white; }
        .btn-no { background: var(--status-error); color: white; }
    </style>
</head>
<body>

    <div class="admin-wrapper">
        <div class="header-bar">
            <div>
                <h1 style="margin:0; font-size:1.3rem;">Panel Administrador</h1>
                <p style="margin:0; font-size:0.8rem; color:var(--text-muted);">RGPracticas Control</p>
            </div>
            <button class="btn-primary btn-danger" id="btnLogout" style="margin:0; width:auto; padding:10px 18px;">Cerrar Sesión</button>
        </div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>Practicante</th>
                        <th>Registro</th>
                        <th>Fecha / Hora</th>
                        <th>Distancia</th>
                        <th>Puntualidad</th>
                        <th>Justificación</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaRegistros">
                    <tr><td colspan="7" style="text-align:center;">Cargando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, getDocs, updateDoc, doc, query, orderBy } 
        from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB6KT4Gw-O4NDhsAREAeAdAmrIuMH53ZyQ",
        authDomain: "rgpracticantes-da4bc.firebaseapp.com",
        projectId: "rgpracticantes-da4bc",
        storageBucket: "rgpracticantes-da4bc.firebasestorage.app",
        messagingSenderId: "378103051147",
        appId: "1:378103051147:web:0c30387cc661d75e0ff58e"
    };

    const db = getFirestore(initializeApp(firebaseConfig));

    document.getElementById("btnLogout").addEventListener("click", () => window.location.href = "index.html");

    async function cargar() {
        const tbody = document.getElementById("tablaRegistros");
        try {
            const q = query(collection(db, "registros"), orderBy("creado", "desc"));
            const snap = await getDocs(q);
            tbody.innerHTML = "";

            snap.forEach((docSnap) => {
                const reg = { id: docSnap.id, ...docSnap.data() };
                const tr = document.createElement("tr");

                let justHtml = "-";
                if (reg.justificacion) {
                    justHtml = `<i>"${reg.justificacion}"</i><br><small><b>Status: ${reg.estadoJustificacion || 'Pendiente'}</b></small>`;
                }

                let btnHtml = "";
                if (reg.justificacion && reg.estadoJustificacion === "Pendiente") {
                    btnHtml = `
                        <button class="btn-sm btn-ok" onclick="responder('${reg.id}', 'Aprobada')">Aprobar</button>
                        <button class="btn-sm btn-no" onclick="responder('${reg.id}', 'Rechazada')">Rechazar</button>
                    `;
                }

                tr.innerHTML = `
                    <td><b>${reg.nombre || reg.usuario}</b></td>
                    <td>${reg.tipo}</td>
                    <td>${reg.fechaHora}</td>
                    <td>${reg.distanciaMetros}m</td>
                    <td><span class="badge badge-${reg.estadoPuntualidad}">${reg.estadoPuntualidad}</span></td>
                    <td>${justHtml}</td>
                    <td>${btnHtml}</td>
                `;
                tbody.appendChild(tr);
            });
        } catch (e) {
            tbody.innerHTML = `<tr><td colspan="7">Error: ${e.message}</td></tr>`;
        }
    }

    window.responder = async function(id, estado) {
        const estadoPunt = estado === "Aprobada" ? "Justificado" : "Rechazado";
        await updateDoc(doc(db, "registros", id), {
            estadoJustificacion: estado,
            estadoPuntualidad: estadoPunt
        });
        cargar();
    };

    cargar();
</script>
</body>
</html>
