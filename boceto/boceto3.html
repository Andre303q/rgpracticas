<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boceto 3 - Corporate Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f1f5f9;
            --surface: #ffffff;
            --text-primary: #334155;
            --text-secondary: #64748b;
            --border: #cbd5e1;
            --primary: #4f46e5;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --surface: #1e293b;
                --text-primary: #f8fafc;
                --text-secondary: #94a3b8;
                --border: #334155;
                --primary: #6366f1;
            }
        }

        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            padding: 16px;
        }

        .navbar {
            background: var(--surface);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .panel-box {
            background: var(--surface);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 16px;
        }

        .table-sim {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 0.85rem;
        }

        .table-sim th, .table-sim td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <div class="navbar">
        <strong>RGPracticas</strong>
        <span style="font-size:0.8rem; color:var(--text-secondary);">Modo Adaptativo</span>
    </div>

    <div class="panel-box">
        <h3 style="margin:0 0 12px 0;">Registros Recientes</h3>
        <table class="table-sim">
            <thead>
                <tr>
                    <th>Usuario</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Juan Perez</td>
                    <td><span style="color:#10b981; font-weight:bold;">Puntual</span></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
