<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGPracticas</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-viewport">
        
        <!-- HEADER PRINCIPAL -->
        <header class="brand-header">
            <div class="brand-logo">RG</div>
            <div class="brand-info">
                <h1>RGPracticas</h1>
                <p id="subtituloHeader">Portal de Asistencia</p>
            </div>
        </header>

        <!-- SECCIÓN DE AUTENTICACIÓN -->
        <main id="seccionAuth" class="bento-card">
            <div class="tab-switcher">
                <button class="tab-btn active" id="tabLogin" onclick="cambiarTab('login')">Ingresar</button>
                <button class="tab-btn" id="tabRegister" onclick="cambiarTab('registro')">Registro</button>
            </div>

            <form id="authForm">
                <div class="field-group hidden" id="groupNombre">
                    <label for="txtNombre">Nombre Completo</label>
                    <input type="text" id="txtNombre" placeholder="Ej. Carlos López">
                </div>

                <div class="field-group">
                    <label for="txtUsuario">Usuario</label>
                    <input type="text" id="txtUsuario" placeholder="Ej. carlos123" required autocomplete="off">
                </div>

                <div class="field-group">
                    <label for="txtPassword">Contraseña</label>
                    <input type="password" id="txtPassword" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary" id="btnAuth">Iniciar Sesión</button>
                <div id="alertAuth" class="alert hidden"></div>
            </form>
        </main>

        <!-- SECCIÓN DE MARCACIÓN -->
        <main id="seccionMarcacion" class="hidden">
            <div id="statusGeo" class="status-pill info">
                📡 Obteniendo posición GPS...
            </div>

            <div class="bento-card">
                <form id="marcacionForm">
                    <div class="field-group">
                        <label for="tipoMarcacion">Tipo de Registro</label>
                        <select id="tipoMarcacion" disabled>
                            <option value="Hora de entrada">Hora de entrada</option>
                            <option value="Hora de salida a almuerzo">Hora de salida a almuerzo</option>
                            <option value="Hora de regreso de almuerzo">Hora de regreso de almuerzo</option>
                            <option value="Hora de salida">Hora de salida</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary" id="btnMarcar" disabled>Registrar Marcación</button>
                </form>

                <div id="alertMarcacion" class="alert hidden"></div>

                <!-- FORMULARIO DE JUSTIFICACIÓN -->
                <div id="boxJustificar" class="hidden" style="margin-top: 16px; border-top: 1px dashed var(--border); padding-top: 16px;">
                    <div class="field-group">
                        <label style="color: var(--warning);">⚠️ Justificar Tardanza / Salida</label>
                        <textarea id="txtJustificacion" rows="3" placeholder="Escribe el motivo del retraso o salida anticipada..."></textarea>
                    </div>
                    <button type="button" class="btn btn-primary" id="btnEnviarJustificacion" style="background: var(--warning); box-shadow: none;">Enviar Justificación</button>
                </div>
            </div>

            <button type="button" class="btn btn-danger-outline" id="btnCerrarSesion">Cerrar Sesión</button>
        </main>

    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, addDoc, updateDoc, collection, serverTimestamp, query, where, getDocs } 
        from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB6KT4Gw-O4NDhsAREAeAdAmrIuMH53ZyQ",
        authDomain: "rgpracticantes-da4bc.firebaseapp.com",
        projectId: "rgpracticantes-da4bc",
        storageBucket: "rgpracticantes-da4bc.firebasestorage.app",
        messagingSenderId: "378103051147",
        appId: "1:378103051147:web:0c30387cc661d75e0ff58e"
    };

    const db = getFirestore(initializeApp(firebaseConfig));

    const LAT_REF = 14.6045042; 
    const LON_REF = -90.5163326;
    const DISTANCIA_MAXIMA = 100; 

    let usuarioActual = null;
    let distanciaActual = 0;
    let latitudDispositivo = null;
    let longitudDispositivo = null;
    let modoAuth = 'login';
    let geoWatchId = null;
    let ultimoRegistroId = null;

    window.cambiarTab = function(modo) {
        modoAuth = modo;
        document.getElementById("alertAuth").classList.add("hidden");
        if (modo === 'registro') {
            document.getElementById("groupNombre").classList.remove("hidden");
            document.getElementById("btnAuth").textContent = "Crear Cuenta";
            document.getElementById("tabRegister").classList.add("active");
            document.getElementById("tabLogin").classList.remove("active");
        } else {
            document.getElementById("groupNombre").classList.add("hidden");
            document.getElementById("btnAuth").textContent = "Iniciar Sesión";
            document.getElementById("tabLogin").classList.add("active");
            document.getElementById("tabRegister").classList.remove("active");
        }
    };

    document.getElementById("authForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const userInput = document.getElementById("txtUsuario").value.trim().toLowerCase();
        const passInput = document.getElementById("txtPassword").value.trim();
        const nombreInput = document.getElementById("txtNombre").value.trim();
        const alertAuth = document.getElementById("alertAuth");

        if (userInput === "admin" && passInput === "1234") {
            window.location.href = "admin.html";
            return;
        }

        try {
            const userRef = doc(db, "usuarios", userInput);
            const userSnap = await getDoc(userRef);

            if (modoAuth === 'registro') {
                if (userSnap.exists()) return mostrarAlerta(alertAuth, "El usuario ya existe.", "error");
                if (!nombreInput) return mostrarAlerta(alertAuth, "Ingresa tu nombre.", "error");

                const nuevo = { usuario: userInput, password: passInput, nombre: nombreInput, rol: "practicante", creado: serverTimestamp() };
                await setDoc(userRef, nuevo);
                usuarioActual = nuevo;
                iniciarPanelPracticante();
            } else {
                if (!userSnap.exists()) return mostrarAlerta(alertAuth, "Usuario no encontrado.", "error");
                const data = userSnap.data();
                if (data.password !== passInput) return mostrarAlerta(alertAuth, "Contraseña incorrecta.", "error");

                if (data.rol === "admin") {
                    window.location.href = "admin.html";
                } else {
                    usuarioActual = data;
                    iniciarPanelPracticante();
                }
            }
        } catch (err) {
            mostrarAlerta(alertAuth, "Error: " + err.message, "error");
        }
    });

    function iniciarPanelPracticante() {
        document.getElementById("seccionAuth").classList.add("hidden");
        document.getElementById("subtituloHeader").textContent = "Hola, " + (usuarioActual.nombre || usuarioActual.usuario);
        document.getElementById("seccionMarcacion").classList.remove("hidden");
        obtenerUbicacionRealTime();
    }

    document.getElementById("btnCerrarSesion").addEventListener("click", () => {
        if (geoWatchId !== null) navigator.geolocation.clearWatch(geoWatchId);
        window.location.reload();
    });

    function obtenerUbicacionRealTime() {
        const statusGeo = document.getElementById("statusGeo");
        const selectTipo = document.getElementById("tipoMarcacion");
        const btnMarcar = document.getElementById("btnMarcar");

        if (!navigator.geolocation) {
            statusGeo.className = "status-pill error";
            statusGeo.innerHTML = "❌ GPS no soportado en este dispositivo.";
            return;
        }

        geoWatchId = navigator.geolocation.watchPosition(
            (pos) => {
                latitudDispositivo = pos.coords.latitude;
                longitudDispositivo = pos.coords.longitude;
                distanciaActual = Math.round(calcularDistancia(latitudDispositivo, longitudDispositivo, LAT_REF, LON_REF));

                if (distanciaActual <= DISTANCIA_MAXIMA) {
                    statusGeo.className = "status-pill success";
                    statusGeo.innerHTML = `📍 Ubicación válida (${distanciaActual}m de la sede)`;
                    selectTipo.disabled = false;
                    btnMarcar.disabled = false;
                } else {
                    statusGeo.className = "status-pill error";
                    statusGeo.innerHTML = `⚠️ Fuera de rango (${distanciaActual}m). Máx: ${DISTANCIA_MAXIMA}m.`;
                    selectTipo.disabled = true;
                    btnMarcar.disabled = true;
                }
            },
            () => { 
                statusGeo.className = "status-pill error"; 
                statusGeo.innerHTML = "⚠️ Activa la ubicación (GPS) para marcar."; 
            },
            { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
        );
    }

    function calcularDistancia(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
        const Δφ = (lat2 - lat1) * Math.PI / 180, Δλ = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function evaluarHorario(tipo) {
        const ahora = new Date();
        const minActuales = ahora.getHours() * 60 + ahora.getMinutes();
        const fechaHoy = ahora.toLocaleDateString("es-PE");

        let estado = "Puntual", obs = "";

        if (tipo === "Hora de entrada") {
            if (minActuales < 480) { estado = "Temprano"; obs = "Llegada anticipada."; }
            else if (minActuales > 480) { estado = "Impuntual"; obs = `Tardanza de ${minActuales - 480} min.`; }
        } else if (tipo === "Hora de salida a almuerzo") {
            if (minActuales < 690) { estado = "Descuidado"; obs = "Salida anticipada."; }
        } else if (tipo === "Hora de regreso de almuerzo") {
            if (minActuales > 750) { estado = "Impuntual"; obs = "Exceso tiempo almuerzo."; }
        } else if (tipo === "Hora de salida") {
            if (minActuales < 1020) { estado = "Descuidado"; obs = "Salida anticipada."; }
        }

        return { estado, observaciones: obs, minutosHora: minActuales, fechaHoy };
    }

    document.getElementById("marcacionForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const tipo = document.getElementById("tipoMarcacion").value;
        const alertMarcacion = document.getElementById("alertMarcacion");
        const btnMarcar = document.getElementById("btnMarcar");

        btnMarcar.disabled = true;

        try {
            const fechaActual = new Date();
            const fechaHoyFormat = fechaActual.toLocaleDateString("es-PE");

            const qLimite = query(collection(db, "registros"), where("usuario", "==", usuarioActual.usuario), where("fechaHoy", "==", fechaHoyFormat));
            const snapshotLimite = await getDocs(qLimite);

            if (snapshotLimite.size >= 5) {
                mostrarAlerta(alertMarcacion, "⚠️ Límite de 5 marcaciones diarias alcanzado.", "error");
                return;
            }

            const evaluacion = evaluarHorario(tipo);

            const docRef = await addDoc(collection(db, "registros"), {
                usuario: usuarioActual.usuario,
                nombre: usuarioActual.nombre || usuarioActual.usuario,
                tipo: tipo,
                distanciaMetros: distanciaActual,
                latitud: latitudDispositivo,
                longitud: longitudDispositivo,
                fechaHora: fechaActual.toLocaleString("es-PE"),
                estadoPuntualidad: evaluacion.estado,
                observaciones: evaluacion.observaciones,
                minutosHora: evaluacion.minutosHora,
                fechaHoy: evaluacion.fechaHoy,
                creado: serverTimestamp()
            });

            ultimoRegistroId = docRef.id;
            mostrarAlerta(alertMarcacion, `Marcación realizada: (${evaluacion.estado})`, "success");

            if (evaluacion.estado === "Impuntual" || evaluacion.estado === "Descuidado") {
                document.getElementById("boxJustificar").classList.remove("hidden");
            } else {
                document.getElementById("boxJustificar").classList.add("hidden");
            }

        } catch (err) {
            mostrarAlerta(alertMarcacion, "Error: " + err.message, "error");
        } finally {
            if (distanciaActual <= DISTANCIA_MAXIMA) btnMarcar.disabled = false;
        }
    });

    document.getElementById("btnEnviarJustificacion").addEventListener("click", async () => {
        const texto = document.getElementById("txtJustificacion").value.trim();
        if (!texto || !ultimoRegistroId) return;

        try {
            await updateDoc(doc(db, "registros", ultimoRegistroId), {
                justificacion: texto,
                estadoJustificacion: "Pendiente"
            });

            mostrarAlerta(document.getElementById("alertMarcacion"), "Justificación enviada al administrador.", "success");
            document.getElementById("boxJustificar").classList.add("hidden");
            document.getElementById("txtJustificacion").value = "";
        } catch (e) {
            mostrarAlerta(document.getElementById("alertMarcacion"), "Error: " + e.message, "error");
        }
    });

    function mostrarAlerta(elem, msg, tipo) {
        elem.textContent = msg;
        elem.className = `alert alert-${tipo}`;
        elem.classList.remove("hidden");
    }
</script>
</body>

            else if (minActuales > 480) { estado = "Impuntual"; obs = `Tardanza de ${minActuales - 480} min.`; }
        } else if (tipo === "Hora de salida a almuerzo") {
            if (minActuales < 690) { estado = "Descuidado"; obs = "Salida anticipada."; }
        } else if (tipo === "Hora de regreso de almuerzo") {
            if (minActuales > 750) { estado = "Impuntual"; obs = "Exceso tiempo almuerzo."; }
        } else if (tipo === "Hora de salida") {
            if (minActuales < 1020) { estado = "Descuidado"; obs = "Salida anticipada."; }
        }

        return { estado, observaciones: obs, minutosHora: minActuales, fechaHoy };
    }

    document.getElementById("marcacionForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const tipo = document.getElementById("tipoMarcacion").value;
        const alertMarcacion = document.getElementById("alertMarcacion");
        const btnMarcar = document.getElementById("btnMarcar");

        btnMarcar.disabled = true;

        try {
            const fechaActual = new Date();
            const fechaHoyFormat = fechaActual.toLocaleDateString("es-PE");

            const qLimite = query(collection(db, "registros"), where("usuario", "==", usuarioActual.usuario), where("fechaHoy", "==", fechaHoyFormat));
            const snapshotLimite = await getDocs(qLimite);

            if (snapshotLimite.size >= 5) {
                mostrarAlerta(alertMarcacion, "⚠️ Límite de 5 marcaciones diarias alcanzado.", "error");
                return;
            }

            const evaluacion = evaluarHorario(tipo);

            const docRef = await addDoc(collection(db, "registros"), {
                usuario: usuarioActual.usuario,
                nombre: usuarioActual.nombre || usuarioActual.usuario,
                tipo: tipo,
                distanciaMetros: distanciaActual,
                latitud: latitudDispositivo,
                longitud: longitudDispositivo,
                fechaHora: fechaActual.toLocaleString("es-PE"),
                estadoPuntualidad: evaluacion.estado,
                observaciones: evaluacion.observaciones,
                minutosHora: evaluacion.minutosHora,
                fechaHoy: evaluacion.fechaHoy,
                creado: serverTimestamp()
            });

            ultimoRegistroId = docRef.id;
            mostrarAlerta(alertMarcacion, `Registrado con éxito: (${evaluacion.estado})`, "success");

            if (evaluacion.estado === "Impuntual" || evaluacion.estado === "Descuidado") {
                document.getElementById("boxJustificar").classList.remove("hidden");
            } else {
                document.getElementById("boxJustificar").classList.add("hidden");
            }

        } catch (err) {
            mostrarAlerta(alertMarcacion, "Error: " + err.message, "error");
        } finally {
            if (distanciaActual <= DISTANCIA_MAXIMA) btnMarcar.disabled = false;
        }
    });

    document.getElementById("btnEnviarJustificacion").addEventListener("click", async () => {
        const texto = document.getElementById("txtJustificacion").value.trim();
        if (!texto || !ultimoRegistroId) return;

        try {
            await updateDoc(doc(db, "registros", ultimoRegistroId), {
                justificacion: texto,
                estadoJustificacion: "Pendiente"
            });

            mostrarAlerta(document.getElementById("alertMarcacion"), "Justificación enviada al administrador.", "success");
            document.getElementById("boxJustificar").classList.add("hidden");
            document.getElementById("txtJustificacion").value = "";
        } catch (e) {
            mostrarAlerta(document.getElementById("alertMarcacion"), "Error: " + e.message, "error");
        }
    });

    function mostrarAlerta(elem, msg, tipo) {
        elem.textContent = msg;
        elem.className = `alert-msg ${tipo}`;
        elem.classList.remove("hidden");
    }
</script>
</body>
</html>
