<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGPracticas - Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-color, #0f172a);
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .login-card {
            max-width: 400px;
            width: 100%;
            background: var(--card-bg, #1a1f2c);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            border: 1px solid var(--border-color, #2d3748);
            box-sizing: border-box;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-secondary, #a0aec0);
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        input {
            width: 100%;
            background: var(--input-bg, #111827);
            border: 1px solid var(--border-color, #2d3748);
            color: var(--text-primary, #fff);
            padding: 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            outline: none;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #0284c7;
        }
        .btn-submit {
            width: 100%;
            background: #0284c7;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background: #0369a1;
        }
        .error-msg {
            color: #ef4444;
            font-size: 0.82rem;
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div style="text-align: center; margin-bottom: 25px;">
            <div class="logo-diamond" style="width: 48px; height: 48px; margin: 0 auto 12px; font-size: 1.1rem;"><span>RG</span></div>
            <h1 style="font-size: 1.4rem; margin: 0; color: var(--text-primary);">RGPracticas</h1>
            <p style="font-size: 0.82rem; color: var(--text-secondary); margin-top: 4px;">Ingresa a tu cuenta para continuar</p>
        </div>

        <form id="formLogin">
            <div class="form-group">
                <label for="txtUsuario">Usuario o Correo</label>
                <input type="text" id="txtUsuario" required placeholder="Ingresa tu usuario...">
            </div>

            <div class="form-group">
                <label for="txtPassword">Contraseña</label>
                <input type="password" id="txtPassword" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-submit" id="btnLogin">Iniciar Sesión</button>
            <div id="mensajeError" class="error-msg"></div>
        </form>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where } 
        from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB6KT4Gw-O4NDhsAREAeAdAmrIuMH53ZyQ",
        authDomain: "rgpracticantes-da4bc.firebaseapp.com",
        projectId: "rgpracticantes-da4bc",
        storageBucket: "rgpracticantes-da4bc.firebasestorage.app",
        messagingSenderId: "378103051147",
        appId: "1:378103051147:web:0c30387cc661d75e0ff58e"
    };

    const db = getFirestore(initializeApp(firebaseConfig));

    document.getElementById("formLogin").addEventListener("submit", async (e) => {
        e.preventDefault();
        const usuarioInput = document.getElementById("txtUsuario").value.trim();
        const passwordInput = document.getElementById("txtPassword").value.trim();
        const mensajeError = document.getElementById("mensajeError");
        const btnLogin = document.getElementById("btnLogin");

        mensajeError.textContent = "";
        btnLogin.textContent = "Verificando...";
        btnLogin.disabled = true;

        try {
            // Buscamos el usuario en la colección "usuarios" de Firestore
            const q = query(collection(db, "usuarios"), where("usuario", "==", usuarioInput));
            const querySnapshot = await getDocs(q);

            if (querySnapshot.empty) {
                // Intento alternativo buscando por campo ID o nombre si es necesario
                mensajeError.textContent = "Usuario o contraseña incorrectos.";
                btnLogin.textContent = "Iniciar Sesión";
                btnLogin.disabled = false;
                return;
            }

            let usuarioEncontrado = null;
            querySnapshot.forEach((doc) => {
                usuarioEncontrado = doc.data();
            });

            if (usuarioEncontrado.password === passwordInput) {
                // Guardamos sesión en localStorage
                localStorage.setItem("usuarioLogueado", usuarioEncontrado.usuario || usuarioInput);
                localStorage.setItem("rolUsuario", usuarioEncontrado.rol || "practicante");
                localStorage.setItem("nombreUsuario", usuarioEncontrado.nombre || usuarioInput);

                // Redirección según rol
                if (usuarioEncontrado.rol === "admin") {
                    window.location.href = "admin.html";
                } else {
                    window.location.href = "dashboard.html"; // O la vista de practicante correspondiente
                }
            } else {
                mensajeError.textContent = "Contraseña incorrecta.";
                btnLogin.textContent = "Iniciar Sesión";
                btnLogin.disabled = false;
            }

        } catch (error) {
            mensajeError.textContent = "Error de conexión: " + error.message;
            btnLogin.textContent = "Iniciar Sesión";
            btnLogin.disabled = false;
        }
    });
</script>

</body>
</html>
