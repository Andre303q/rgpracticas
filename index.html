<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGPracticas - Portal de Asistencia</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-wrapper">
        <div class="card">
            <!-- BOTÓN CAMBIO DE TEMA DENTRO DEL CONTAINER -->
            <div class="theme-switch-container">
                <button class="theme-toggle-btn" id="btnThemeToggle" type="button">
                    <span id="themeIcon">🌙</span> <span id="themeText">Oscuro</span>
                </button>
            </div>

            <div class="brand-box">
                <div class="logo-diamond"><span>RG</span></div>
                <h1>RGPracticas</h1>
                <p id="subtituloCard">Portal de Asistencia</p>
            </div>

            <!-- NAVEGACIÓN INGRESAR / REGISTRO -->
            <div class="nav-tabs" id="tabsAuth">
                <button class="tab-link active" id="tabLogin" type="button" onclick="cambiarModo('login')">Ingresar</button>
                <button class="tab-link" id="tabRegister" type="button" onclick="cambiarModo('registro')">Registro</button>
            </div>

            <!-- FORMULARIO -->
            <form id="authForm">
                <div class="input-block hidden" id="groupNombre">
                    <label>Nombre Completo</label>
                    <div class="input-icon-wrapper">
                        <span class="icon">👤</span>
                        <input type="text" id="txtNombre" placeholder="Ej. Carlos García">
                    </div>
                </div>

                <div class="input-block">
                    <label>USUARIO</label>
                    <div class="input-icon-wrapper">
                        <span class="icon">👤</span>
                        <input type="text" id="txtUsuario" placeholder="Ej. carlos123" required autocomplete="off">
                    </div>
                </div>

                <div class="input-block">
                    <label>CONTRASEÑA</label>
                    <div class="input-icon-wrapper">
                        <span class="icon">🔒</span>
                        <input type="password" id="txtPassword" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary" id="btnSubmit">Iniciar Sesión</button>
                <div id="alertAuth" class="alert-msg hidden"></div>
            </form>

            <!-- VISTA MARCACIÓN -->
            <div id="vistaMarcacion" class="hidden">
                <div class="gps-pill info" id="statusGeo">
                    📡 Obteniendo ubicación GPS...
                </div>

                <form id="marcacionForm">
                    <div class="input-block">
                        <label>Tipo de Registro</label>
                        <div class="input-icon-wrapper">
                            <span class="icon">🕒</span>
                            <select id="tipoMarcacion" disabled style="padding-left: 40px;">
                                <option value="Hora de entrada">Hora de entrada</option>
                                <option value="Hora de salida a almuerzo">Hora de salida a almuerzo</option>
                                <option value="Hora de regreso de almuerzo">Hora de regreso de almuerzo</option>
                                <option value="Hora de salida">Hora de salida</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary" id="btnMarcar" disabled>Registrar Marcación</button>
                </form>

                <div id="alertMarcacion" class="alert-msg hidden"></div>

                <!-- BLOQUE DE JUSTIFICACIÓN (SOLO TEXTO) -->
                <div id="boxJustificar" class="hidden" style="margin-top: 18px; border-top: 1px dashed var(--border-color); padding-top: 16px;">
                    <label style="font-size: 0.75rem; font-weight: 800; color: var(--status-warning); display: block; margin-bottom: 6px;">⚠️ JUSTIFICAR IMPUNTUALIDAD / SALIDA</label>
                    
                    <div class="input-block">
                        <div class="input-icon-wrapper">
                            <span class="icon" style="top: 12px;">📝</span>
                            <textarea id="txtJustificacion" rows="3" placeholder="Describe la razón aquí..."></textarea>
                        </div>
                    </div>

                    <button class="btn-primary" id="btnEnviarJustificacion" type="button" style="background: var(--status-warning); box-shadow: none; margin-top: 12px;">Enviar Motivo</button>
                </div>

                <button class="btn-danger-link" id="btnCerrarSesion" type="button">Cerrar Sesión</button>
            </div>

        </div>
    </div>

<script>
    const btnToggle = document.getElementById("btnThemeToggle");
    const themeIcon = document.getElementById("themeIcon");
    const themeText = document.getElementById("themeText");

    function aplicarTema(tema) {
        if (tema === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
            themeIcon.textContent = "☀️";
            themeText.textContent = "Claro";
        } else {
            document.documentElement.setAttribute("data-theme", "light");
            themeIcon.textContent = "🌙";
            themeText.textContent = "Oscuro";
        }
    }

    const temaGuardado = localStorage.getItem("tema_app");
    const prefiereOscuro = window.matchMedia("(prefers-color-scheme: dark)").matches;
    aplicarTema(temaGuardado || (prefiereOscuro ? "dark" : "light"));

    btnToggle.addEventListener("click", () => {
        const nuevoTema = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
        aplicarTema(nuevoTema);
        localStorage.setItem("tema_app", nuevoTema);
    });
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, addDoc, updateDoc, collection, serverTimestamp, query, where, getDocs } 
        from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB6KT4Gw-O4NDhsAREAeAdAmrIuMH53ZyQ",
        authDomain: "rgpracticantes-da4bc.firebaseapp.com",
        projectId: "rgpracticantes-da4bc",
        storageBucket: "rgpracticantes-da4bc.firebasestorage.app",
        messagingSenderId: "378103051147",
        appId: "1:378103051147:web:0c30387cc661d75e0ff58e"
    };

    const db = getFirestore(initializeApp(firebaseConfig));

    const LAT_REF = 14.6045042; 
    const LON_REF = -90.5163326;
    const DISTANCIA_MAXIMA = 100; 

    let usuarioActual = null;
    let distanciaActual = 0;
    let latitudDispositivo = null;
    let longitudDispositivo = null;
    let modoActual = 'login';
    let geoWatchId = null;
    let ultimoRegistroId = null;

    window.cambiarModo = function(modo) {
        modoActual = modo;
        document.getElementById("alertAuth").classList.add("hidden");
        if (modo === 'registro') {
            document.getElementById("groupNombre").classList.remove("hidden");
            document.getElementById("btnSubmit").textContent = "Crear Cuenta";
            document.getElementById("tabRegister").classList.add("active");
            document.getElementById("tabLogin").classList.remove("active");
        } else {
            document.getElementById("groupNombre").classList.add("hidden");
            document.getElementById("btnSubmit").textContent = "Iniciar Sesión";
            document.getElementById("tabLogin").classList.add("active");
            document.getElementById("tabRegister").classList.remove("active");
        }
    };

    document.getElementById("authForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const userInput = document.getElementById("txtUsuario").value.trim().toLowerCase();
        const passInput = document.getElementById("txtPassword").value.trim();
        const nombreInput = document.getElementById("txtNombre").value.trim();
        const alertAuth = document.getElementById("alertAuth");

        if (userInput === "admin" && passInput === "1234") {
            window.location.href = "admin.html";
            return;
        }

        try {
            const userRef = doc(db, "usuarios", userInput);
            const userSnap = await getDoc(userRef);

            if (modoActual === 'registro') {
                if (userSnap.exists()) return mostrarAlerta(alertAuth, "El usuario ya existe.", "error");
                if (!nombreInput) return mostrarAlerta(alertAuth, "Ingresa tu nombre.", "error");

                const nuevo = { usuario: userInput, password: passInput, nombre: nombreInput, rol: "practicante", creado: serverTimestamp() };
                await setDoc(userRef, nuevo);
                usuarioActual = nuevo;
                iniciarPanelPracticante();
            } else {
                if (!userSnap.exists()) return mostrarAlerta(alertAuth, "Usuario no existe.", "error");
                const data = userSnap.data();
                if (data.password !== passInput) return mostrarAlerta(alertAuth, "Contraseña incorrecta.", "error");

                if (data.rol === "admin") {
                    window.location.href = "admin.html";
                } else {
                    usuarioActual = data;
                    iniciarPanelPracticante();
                }
            }
        } catch (err) {
            mostrarAlerta(alertAuth, "Error: " + err.message, "error");
        }
    });

    function iniciarPanelPracticante() {
        document.getElementById("authForm").classList.add("hidden");
        document.getElementById("tabsAuth").classList.add("hidden");
        document.getElementById("subtituloCard").textContent = "Hola, " + (usuarioActual.nombre || usuarioActual.usuario);
        document.getElementById("vistaMarcacion").classList.remove("hidden");
        obtenerUbicacionRealTime();
    }

    document.getElementById("btnCerrarSesion").addEventListener("click", () => {
        if (geoWatchId !== null) navigator.geolocation.clearWatch(geoWatchId);
        window.location.reload();
    });

    function obtenerUbicacionRealTime() {
        const statusGeo = document.getElementById("statusGeo");
        const selectTipo = document.getElementById("tipoMarcacion");
        const btnMarcar = document.getElementById("btnMarcar");

        if (!navigator.geolocation) return statusGeo.innerHTML = "GPS no disponible.";

        geoWatchId = navigator.geolocation.watchPosition(
            (pos) => {
                latitudDispositivo = pos.coords.latitude;
                longitudDispositivo = pos.coords.longitude;
                distanciaActual = Math.round(calcularDistancia(latitudDispositivo, longitudDispositivo, LAT_REF, LON_REF));

                if (distanciaActual <= DISTANCIA_MAXIMA) {
                    statusGeo.className = "gps-pill ok";
                    statusGeo.innerHTML = `📍 En rango permitido (${distanciaActual} m)`;
                    selectTipo.disabled = false;
                    btnMarcar.disabled = false;
                } else {
                    statusGeo.className = "gps-pill bad";
                    statusGeo.innerHTML = `⚠️ Fuera de rango (${distanciaActual} m). Máximo: ${DISTANCIA_MAXIMA} m.`;
                    selectTipo.disabled = true;
                    btnMarcar.disabled = true;
                }
            },
            () => { statusGeo.className = "gps-pill bad"; statusGeo.innerHTML = "⚠️ GPS Desactivado."; },
            { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
        );
    }

    function calcularDistancia(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
        const Δφ = (lat2 - lat1) * Math.PI / 180, Δλ = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function evaluarHorario(tipo) {
        const ahora = new Date();
        const minActuales = ahora.getHours() * 60 + ahora.getMinutes();
        const fechaHoy = ahora.toLocaleDateString("es-PE");

        let estado = "Puntual", obs = "";
        if (tipo === "Hora de entrada" && minActuales > 480) { estado = "Impuntual"; obs = `Tardanza de ${minActuales - 480} min.`; }
        else if (tipo === "Hora de salida a almuerzo" && minActuales < 690) { estado = "Descuidado"; obs = "Salida anticipada."; }
        else if (tipo === "Hora de regreso de almuerzo" && minActuales > 750) { estado = "Impuntual"; obs = "Exceso tiempo almuerzo."; }
        else if (tipo === "Hora de salida" && minActuales < 1020) { estado = "Descuidado"; obs = "Salida anticipada."; }

        return { estado, observaciones: obs, minutosHora: minActuales, fechaHoy };
    }

    document.getElementById("marcacionForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const tipo = document.getElementById("tipoMarcacion").value;
        const alertMarcacion = document.getElementById("alertMarcacion");
        const btnMarcar = document.getElementById("btnMarcar");

        btnMarcar.disabled = true;

        try {
            const fechaActual = new Date();
            const evaluacion = evaluarHorario(tipo);

            const docRef = await addDoc(collection(db, "registros"), {
                usuario: usuarioActual.usuario,
                nombre: usuarioActual.nombre || usuarioActual.usuario,
                tipo: tipo,
                distanciaMetros: distanciaActual,
                latitud: latitudDispositivo,
                longitud: longitudDispositivo,
                fechaHora: fechaActual.toLocaleString("es-PE"),
                estadoPuntualidad: evaluacion.estado,
                observaciones: evaluacion.observaciones,
                minutosHora: evaluacion.minutosHora,
                fechaHoy: evaluacion.fechaHoy,
                creado: serverTimestamp()
            });

            ultimoRegistroId = docRef.id;
            mostrarAlerta(alertMarcacion, `Registrado con éxito: (${evaluacion.estado})`, "success");

            if (evaluacion.estado === "Impuntual" || evaluacion.estado === "Descuidado") {
                document.getElementById("boxJustificar").classList.remove("hidden");
            } else {
                document.getElementById("boxJustificar").classList.add("hidden");
            }
        } catch (err) {
            mostrarAlerta(alertMarcacion, "Error: " + err.message, "error");
        } finally {
            if (distanciaActual <= DISTANCIA_MAXIMA) btnMarcar.disabled = false;
        }
    });

    document.getElementById("btnEnviarJustificacion").addEventListener("click", async () => {
        const texto = document.getElementById("txtJustificacion").value.trim();
        const alertMarcacion = document.getElementById("alertMarcacion");
        const btnEnviar = document.getElementById("btnEnviarJustificacion");

        if (!texto || !ultimoRegistroId) {
            alert("Por favor ingresa un motivo.");
            return;
        }

        try {
            btnEnviar.disabled = true;
            btnEnviar.textContent = "Enviando...";

            await updateDoc(doc(db, "registros", ultimoRegistroId), {
                justificacion: texto,
                estadoPuntualidad: "Apelado / Justificado",
                estadoJustificacion: "Pendiente"
            });

            mostrarAlerta(alertMarcacion, "Justificación enviada con éxito.", "success");
            document.getElementById("boxJustificar").classList.add("hidden");
            document.getElementById("txtJustificacion").value = "";
        } catch (e) {
            mostrarAlerta(alertMarcacion, "Error al enviar: " + e.message, "error");
        } finally {
            btnEnviar.disabled = false;
            btnEnviar.textContent = "Enviar Motivo";
        }
    });

    function mostrarAlerta(elem, msg, tipo) {
        elem.textContent = msg;
        elem.className = `alert-msg ${tipo}`;
        elem.classList.remove("hidden");
    }
</script>
</body>
</html>
